        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        display: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        cream: '#FFF9F5',
                        blush: '#FFE8EF',
                        rosePastel: '#FF85A1',
                        roseDeep: '#FF5C8A',
                        lavenderSoft: '#EBE4F2',
                        lavenderText: '#7D6B8F',
                        cocoa: '#5A3D4C'
                    },
                    animation: {
                        'float-slow': 'float 4s ease-in-out infinite',
                        'wiggle': 'wiggle 1.8s ease-in-out infinite',
                        'heartbeat': 'heartbeat 1.3s ease-in-out infinite',
                        'bounce-gentle': 'bounceGentle 2s infinite',
                        'shake-cute': 'shakeCute 0.6s ease-in-out',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-10px) rotate(1.5deg)' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-2deg)' },
                            '50%': { transform: 'rotate(2deg)' },
                        },
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '25%': { transform: 'scale(1.08)' },
                            '40%': { transform: 'scale(0.98)' },
                            '60%': { transform: 'scale(1.06)' },
                        },
                        bounceGentle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        shakeCute: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '20%': { transform: 'translateX(-6px) rotate(-2deg)' },
                            '40%': { transform: 'translateX(6px) rotate(2deg)' },
                            '60%': { transform: 'translateX(-4px) rotate(-1deg)' },
                            '80%': { transform: 'translateX(4px) rotate(1deg)' },
                        }
                    }
                }
            }
        }

    <style>
        /* Custom Sticker White Die-Cut Border Effect */
        .cat-sticker {
            filter: drop-shadow(0px 8px 16px rgba(255, 133, 161, 0.25));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cat-sticker:hover {
            transform: scale(1.06) rotate(2deg);
        }

        /* Screen Fade & Scale Transitions */
        .screen {
            transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .screen-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.94) translateY(12px);
            position: absolute;
            visibility: hidden;
        }
        .screen-visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(0);
            position: relative;
            visibility: visible;
        }

        /* Floating Particles Animation */
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.85;
            }
            85% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(-15vh) scale(1.1) rotate(25deg);
                opacity: 0;
            }
        }
        .floating-particle {
            position: fixed;
            bottom: -40px;
            pointer-events: none;
            z-index: 1;
            animation: floatUp linear forwards;
        }

        /* Cat Hug Shower Falling + Swaying + Gentle Bounce Animations */
        @keyframes hugRainFall {
            0% {
                transform: translateY(-90px) scale(0.75);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            82% {
                transform: translateY(88vh) scale(1.05);
                opacity: 1;
            }
            91% {
                transform: translateY(83vh) scale(1.12, 0.92);
                opacity: 0.95;
            }
            100% {
                transform: translateY(104vh) scale(0.95);
                opacity: 0;
            }
        }
        @keyframes hugSway {
            0%, 100% {
                transform: translateX(-18px) rotate(-12deg);
            }
            50% {
                transform: translateX(18px) rotate(12deg);
            }
        }
        .hug-shower-drop {
            position: fixed;
            top: -80px;
            pointer-events: none;
            z-index: 40;
            animation: hugRainFall cubic-bezier(0.35, 0.05, 0.55, 0.95) forwards;
            will-change: transform, opacity;
        }
        .hug-shower-sway {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            animation: hugSway ease-in-out infinite;
            filter: drop-shadow(0 6px 12px rgba(255, 92, 138, 0.25));
        }

        /* Soft Polka Dot Background */
        .bg-pastel-dots {
            background-color: #FFF9F5;
            background-image: radial-gradient(#FFD1DF 2px, transparent 2px), radial-gradient(#FFE3EC 2px, #FFF9F5 2px);
            background-size: 44px 44px;
            background-position: 0 0, 22px 22px;
        }

        /* Button Tactile Press */
        .btn-cute {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-cute:active {
            transform: scale(0.93) !important;
        }
    </style>
</head>

    <script>
        let noClickCount = 0;
        let heartInterval = null;

        const screens = {
            ask: document.getElementById('screen-ask'),
            yes: document.getElementById('screen-yes'),
            no: document.getElementById('screen-no')
        };

        const btnYes = document.getElementById('btn-yes');
        const askSubtext = document.getElementById('ask-subtext');
        const particlesContainer = document.getElementById('particles-container');

        /**
         * Transitions smoothly between screens ('ask', 'yes', 'no')
         * @param {string} targetScreen - Key of the screen to show
         * @param {boolean} fromNo - Whether returning from the "No" screen
         */
        function goToScreen(targetScreen, fromNo = false) {
            // Hide all screens
            Object.values(screens).forEach(screen => {
                screen.classList.remove('screen-visible');
                screen.classList.add('screen-hidden');
            });

            // Show target screen
            const activeScreen = screens[targetScreen];
            activeScreen.classList.remove('screen-hidden');
            activeScreen.classList.add('screen-visible');

            // Handle special behaviors per screen
            if (targetScreen === 'yes') {
                startCelebration();
            } else {
                stopCelebration();
            }

            if (targetScreen === 'no') {
                noClickCount++;
                const grumpySticker = document.getElementById('grumpy-sticker');
                grumpySticker.classList.remove('animate-shake-cute');
                void grumpySticker.offsetWidth; // trigger reflow
                grumpySticker.classList.add('animate-shake-cute');
            }

            if (targetScreen === 'ask' && fromNo) {
                // Make the "Yes" button slightly bigger & bouncier every time she returns from "No"!
                const scaleFactor = Math.min(1 + noClickCount * 0.14, 1.55);
                btnYes.style.transform = `scale(${scaleFactor})`;
                btnYes.classList.add('animate-bounce-gentle');

                const playfulHints = [
                    "Hint: The pink button on the left is the right choice! 😉✨",
                    "Pretty please? Look how big and shiny the Yes button is! 🥺💖",
                    "My little cat heart can't take another 'No'! 😿💕"
                ];
                askSubtext.textContent = playfulHints[Math.min(noClickCount - 1, playfulHints.length - 1)];
            }
        }

        /**
         * Wiggles a cat sticker playfully when tapped
         */
        function wiggleSticker(el) {
            el.classList.remove('animate-shake-cute');
            void el.offsetWidth;
            el.classList.add('animate-shake-cute');
        }

        /**
         * Spawns a single floating heart or sparkle particle
         */
        function spawnParticle(isBurst = false) {
            const symbols = ['❤️', '💖', '💕', '✨', '🌸', '🐾', '💗'];
            const particle = document.createElement('span');
            particle.className = 'floating-particle select-none';
            particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];

            const size = isBurst ? (Math.random() * 18 + 18) : (Math.random() * 14 + 14);
            const left = Math.random() * 96 + 2;
            const duration = isBurst ? (Math.random() * 2.2 + 2.5) : (Math.random() * 3 + 4);

            particle.style.fontSize = `${size}px`;
            particle.style.left = `${left}vw`;
            particle.style.animationDuration = `${duration}s`;

            particlesContainer.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, duration * 1000);
        }

        /**
         * Starts continuous floating hearts on the "Yes" screen
         */
        function startCelebration() {
            burstHearts();
            if (!heartInterval) {
                heartInterval = setInterval(() => spawnParticle(false), 380);
            }
        }

        /**
         * Stops continuous heart spawning when leaving "Yes" screen
         */
        function stopCelebration() {
            if (heartInterval) {
                clearInterval(heartInterval);
                heartInterval = null;
            }
        }

        /**
         * Triggers a joyful burst of hearts & sparkles
         */
        function burstHearts() {
            for (let i = 0; i < 16; i++) {
                setTimeout(() => spawnParticle(true), i * 65);
            }
        }

        /**
         * Returns a mini die-cut SVG sticker of two cute cats hugging
         */
        function createMiniCatHugStickerSVG() {
            return `
                <svg viewBox="0 0 96 76" class="w-11 h-9 sm:w-12 sm:h-10" xmlns="http://www.w3.org/2000/svg">
                    <g stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
                        <ellipse cx="34" cy="44" rx="22" ry="20" fill="#FFFFFF"/>
                        <ellipse cx="62" cy="44" rx="22" ry="20" fill="#FFFFFF"/>
                    </g>
                    <!-- Cream Cat (Left) -->
                    <path d="M18 32 L14 14 L30 24 Z" fill="#FFFDF9" stroke="#5A3D4C" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M48 32 L52 14 L36 24 Z" fill="#FFFDF9" stroke="#5A3D4C" stroke-width="2.5" stroke-linejoin="round"/>
                    <ellipse cx="33" cy="44" rx="20" ry="18" fill="#FFFDF9" stroke="#5A3D4C" stroke-width="2.5"/>
                    <path d="M23 41 Q27 36 31 41" fill="none" stroke="#5A3D4C" stroke-width="2.3" stroke-linecap="round"/>
                    <path d="M36 41 Q40 36 44 41" fill="none" stroke="#5A3D4C" stroke-width="2.3" stroke-linecap="round"/>
                    <ellipse cx="22" cy="46" rx="4" ry="2.5" fill="#FF85A1" opacity="0.75"/>
                    <!-- Calico Peach Cat (Right) -->
                    <path d="M48 32 L44 14 L60 24 Z" fill="#FFE5D9" stroke="#5A3D4C" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M78 32 L82 14 L66 24 Z" fill="#FFE5D9" stroke="#5A3D4C" stroke-width="2.5" stroke-linejoin="round"/>
                    <ellipse cx="63" cy="44" rx="20" ry="18" fill="#FFE5D9" stroke="#5A3D4C" stroke-width="2.5"/>
                    <path d="M52 41 Q56 36 60 41" fill="none" stroke="#5A3D4C" stroke-width="2.3" stroke-linecap="round"/>
                    <path d="M65 41 Q69 36 73 41" fill="none" stroke="#5A3D4C" stroke-width="2.3" stroke-linecap="round"/>
                    <ellipse cx="74" cy="46" rx="4" ry="2.5" fill="#FF85A1" opacity="0.75"/>
                    <!-- Hugging Paws & Floating Heart -->
                    <ellipse cx="48" cy="52" rx="7" ry="5" fill="#FFFDF9" stroke="#5A3D4C" stroke-width="2.2"/>
                    <path d="M48 18 C48 18 41 12 41 8 C41 5.5 43 4 45.5 4 C47 4 48 5.5 48 5.5 C48 5.5 49 4 50.5 4 C53 4 55 5.5 55 8 C55 12 48 18 48 18 Z" fill="#FF5C8A"/>
                </svg>
            `;
        }

        /**
         * Spawns a single falling & swaying cat hug item across the viewport
         */
        function spawnCatHugDrop() {
            const hugEmojis = [ ];
            const drop = document.createElement('div');
            drop.className = 'hug-shower-drop select-none';

            const inner = document.createElement('span');
            inner.className = 'hug-shower-sway';

            // 30% chance to spawn a custom hugging-cats die-cut sticker SVG!
            if (Math.random() < 0.30) {
                inner.innerHTML = createMiniCatHugStickerSVG();
            } else {
                inner.textContent = hugEmojis[Math.floor(Math.random() * hugEmojis.length)];
                const fontSize = Math.floor(Math.random() * 18) + 26; // 26px to 44px
                inner.style.fontSize = `${fontSize}px`;
            }

            const leftPos = Math.random() * 94 + 2;
            const fallDuration = (Math.random() * 2.2 + 2.8).toFixed(2);
            const swayDuration = (Math.random() * 1.1 + 1.1).toFixed(2);
            const swayDelay = (Math.random() * -1.5).toFixed(2);

            drop.style.left = `${leftPos}vw`;
            drop.style.animationDuration = `${fallDuration}s`;
            inner.style.animationDuration = `${swayDuration}s`;
            inner.style.animationDelay = `${swayDelay}s`;

            drop.appendChild(inner);
            document.body.appendChild(drop);

            setTimeout(() => {
                drop.remove();
            }, parseFloat(fallDuration) * 1000 + 100);
        }

        /**
         * Triggers a full-screen shower of cat hug emojis, custom hugging cat stickers, and heart bursts
         */
        function triggerCatHugShower() {
            burstHearts();

            const btn = document.getElementById('btn-extra-hugs');
            if (btn) {
                btn.classList.remove('animate-shake-cute');
                void btn.offsetWidth;
                btn.classList.add('animate-shake-cute');
            }

            // Shower 34 staggered cat hug drops across the full screen
            for (let i = 0; i < 34; i++) {
                setTimeout(() => {
                    spawnCatHugDrop();
                }, i * 55);
            }
        }

        // Spawn a few gentle ambient sparkles on initial load
        window.addEventListener('DOMContentLoaded', () => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => spawnParticle(false), i * 500);
            }
        });
    </script>
</body>
</html>
